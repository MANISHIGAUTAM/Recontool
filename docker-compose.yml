# ─────────────────────────────────────────────────────────────────────────────
# Recontool — full stack. Minimal boot path:
#
#   cp .env.example .env        # fill in any API keys you have (all optional)
#   docker compose up --build   # builds the app image (bundles recon CLIs)
#
# Then run scans:
#   docker compose run --rm recontool demo recontool.local           # zero-network demo
#   docker compose run --rm recontool scan acme.com --mode live      # passive (safe)
#   docker compose run --rm recontool scan acme.com --mode live --authorize-active
#
# SQLite + in-process queue work out of the box (no extra services needed).
# Bring up postgres/redis with the "full" profile for scale:
#   docker compose --profile full up -d postgres redis
#   then set RECON_DB_URL / RECON_REDIS_URL in .env.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Main orchestration app (bundles all recon CLI tools) ──────────────────
  recontool:
    build: .
    image: recontool:latest
    env_file:
      - .env
    environment:
      RECON_ARTIFACT_DIR: /app/artifacts
      RECON_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config
      - ./artifacts:/app/artifacts
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy
    # default command: run the zero-network demo so a fresh `up` proves the stack
    command: ["demo", "recontool.local"]

  # ── Redis for task queue and rate-limit buckets ───────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Worker service for distributed adapter execution ──────────────────────
  worker:
    build: .
    image: recontool:latest
    env_file:
      - .env
    environment:
      RECON_ARTIFACT_DIR: /app/artifacts
      RECON_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["worker", "--concurrency", "4"]

  # ── Optional: PostgreSQL canonical store (profile: full) ──────────────────
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recontool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Optional: local mock provider service for demo/test (profile: mock) ───
  # Demo mode uses the IN-PROCESS mock by default, so this is only needed if you
  # want an out-of-process mock endpoint to point live adapters at during dev.
  mockserver:
    build: .
    image: recontool:latest
    profiles: ["mock"]
    env_file:
      - .env
    environment:
      RECON_MODE: demo
    command: ["replay-fixtures"]

volumes:
  pgdata:
