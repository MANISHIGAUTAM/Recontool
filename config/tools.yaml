# ─────────────────────────────────────────────────────────────────────────────
# Recontool — Machine-readable Tool Registry (the integration backbone)
#
# Each tool declares a CONTRACT the orchestrator uses to chain tools:
#   category        : 1..28 (see docs/pipeline/03-category-pipelines.md)
#   phase           : pipeline phase (p1_seed | p2_expansion | p3_enrichment |
#                     p4_verify | p5_deep | p6_vuln)  — maps to adapter registry
#   type            : passive | active            (active => requires --authorize-active)
#   integration     : cli | api | python | dataset
#   binary          : executable name (cli) — used for availability check
#   install         : how setup.sh installs it  {method: go|pip|apt|git|binary, ref: ...}
#   invocation      : command/endpoint template; {domain},{host},{ip},{url},{infile},{outfile}
#   input           : artifact type consumed  (domain|subdomain|ip|cidr|asn|url|host_port|js_file|cert)
#   output          : artifact type produced
#   output_format   : json | jsonl | text | xml | csv | screenshot
#   requires_key    : env var name of API key, or false
#   default_on      : true => ships wired-on; false => toggle
#   chains_to       : categories/phases this output naturally feeds
#
# This file is BOTH documentation and runtime config. Adapters read it to know how to
# invoke a tool and what to expect back. Tools without an adapter yet are still listed
# (status: planned) so the catalog stays complete.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  version: 1
  schema: recontool-tool-registry/v1

# ===========================================================================
# CATEGORY 1 — Internet-Wide Search Engines & Asset Discovery   [PASSIVE]
# ===========================================================================
tools:

  uncover:
    category: 1
    phase: p1_seed
    type: passive
    integration: cli
    binary: uncover
    install: {method: go, ref: "github.com/projectdiscovery/uncover/cmd/uncover@latest"}
    invocation: "uncover -q {domain} -json"
    input: domain
    output: host_port
    output_format: jsonl
    requires_key: false   # uses provider keys from env if present (shodan/censys/fofa)
    default_on: true
    chains_to: [3, 5, 21]
    notes: "One query hits Shodan/Censys/FOFA/ZoomEye/Netlas. Primary Cat-1 entrypoint."

  shodan:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://api.shodan.io/shodan/host/search?key={key}&query=hostname:{domain}"
    input: domain
    output: service
    output_format: json
    requires_key: SHODAN_API_KEY
    default_on: true
    chains_to: [3, 12, 21]
    notes: "Banners, ports, CVE hints. Free InternetDB endpoint (internetdb) needs no credits."

  internetdb:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://internetdb.shodan.io/{ip}"
    input: ip
    output: service
    output_format: json
    requires_key: false
    default_on: true
    chains_to: [12, 21]
    notes: "Free Shodan: ports + CVEs per IP, no API credits consumed."

  censys:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "POST https://search.censys.io/api/v2/hosts/search"
    input: domain
    output: cert
    output_format: json
    requires_key: CENSYS_API_ID   # also CENSYS_API_SECRET
    default_on: true
    chains_to: [2, 24]
    notes: "Best cert analytics; SANs -> new subdomains (feeds Cat 2/24)."

  netlas:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://app.netlas.io/api/responses/?q={domain}"
    input: domain
    output: service
    output_format: json
    requires_key: NETLAS_API_KEY
    default_on: false
    chains_to: [3, 21]
    notes: "Modern Shodan/Censys alternative; generous free tier."

  greynoise:
    category: 1
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://api.greynoise.io/v3/community/{ip}"
    input: ip
    output: tag
    output_format: json
    requires_key: GREYNOISE_API_KEY   # community endpoint works keyless-ish
    default_on: true
    chains_to: []
    notes: "Enrichment overlay: tags mass-scanner IPs to suppress noise. No new assets."

  leakix:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://leakix.net/host/{ip}"
    input: ip
    output: finding
    output_format: json
    requires_key: LEAKIX_API_KEY
    default_on: false
    chains_to: [12]
    notes: "Exposed services/leaks -> exposure findings."

  fullhunt:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://fullhunt.io/api/v1/domain/{domain}/details"
    input: domain
    output: subdomain
    output_format: json
    requires_key: FULLHUNT_API_KEY
    default_on: false
    chains_to: [2, 5]

  urlscan:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://urlscan.io/api/v1/search/?q=domain:{domain}"
    input: domain
    output: url
    output_format: json
    requires_key: URLSCAN_API_KEY   # search works without key (lower limits)
    default_on: true
    chains_to: [4, 22]
    notes: "Web fingerprint, JS, related infra. Use unlisted/private for live engagements."

  criminalip:
    category: 1
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://api.criminalip.io/v1/asset/domain/report?query={domain}"
    input: domain
    output: service
    output_format: json
    requires_key: CRIMINALIP_API_KEY
    default_on: false

  # ===========================================================================
  # CATEGORY 2 — Passive DNS & Subdomain Enumeration   [PASSIVE -> ACTIVE]
  # ===========================================================================

  subfinder:
    category: 2
    phase: p2_expansion
    type: passive
    integration: cli
    binary: subfinder
    install: {method: go, ref: "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"}
    invocation: "subfinder -d {domain} -silent -all -json"
    input: domain
    output: subdomain
    output_format: jsonl
    requires_key: false   # optional provider keys via ~/.config/subfinder/provider-config.yaml
    default_on: true
    chains_to: [2, 5]
    notes: "Primary passive aggregator (30+ sources). Industry standard."

  crtsh:
    category: 2
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://crt.sh/?q=%25.{domain}&output=json"
    input: domain
    output: subdomain
    output_format: json
    requires_key: false
    default_on: true
    chains_to: [2, 24]
    notes: "CT logs (authoritative, conf 0.9). Flaky uptime -> cache 6-24h."

  certspotter:
    category: 2
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://api.certspotter.com/v1/issuances?domain={domain}&include_subdomains=true&expand=dns_names"
    input: domain
    output: subdomain
    output_format: json
    parse:
      format: json
      emit:
        - {entity: asset, value_each: dns_names, type: subdomain, scope_filter: subdomain}
    requires_key: CERTSPOTTER_API_KEY
    default_on: true
    chains_to: [2]
    notes: "Great for CONTINUOUS CT monitoring (EASM alerts on new certs)."

  chaos:
    category: 2
    phase: p2_expansion
    type: passive
    integration: api
    invocation: "GET https://dns.projectdiscovery.io/dns/{domain}/subdomains"
    input: domain
    output: subdomain
    output_format: json
    requires_key: CHAOS_API_KEY
    default_on: false
    chains_to: [2]

  securitytrails:
    category: 2
    phase: p2_expansion
    type: passive
    integration: api
    invocation: "GET https://api.securitytrails.com/v1/domain/{domain}/subdomains"
    input: domain
    output: subdomain
    output_format: json
    requires_key: SECURITYTRAILS_API_KEY
    default_on: false
    chains_to: [2, 3]
    notes: "Best paid passive DNS + history. Throttle to plan quota."

  virustotal:
    category: 2
    phase: p2_expansion
    type: passive
    integration: api
    invocation: "GET https://www.virustotal.com/api/v3/domains/{domain}/subdomains"
    input: domain
    output: subdomain
    output_format: json
    requires_key: VIRUSTOTAL_API_KEY
    default_on: false
    notes: "Free tier 4 req/min, 500/day -> hard throttle."

  hackertarget:
    category: 2
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://api.hackertarget.com/hostsearch/?q={domain}"
    input: domain
    output: subdomain
    output_format: csv
    requires_key: false
    default_on: true
    chains_to: [2, 3]
    notes: "Free hostsearch gives subdomain,ip pairs. Daily quota."

  alienvault_otx:
    category: 2
    phase: p1_seed
    type: passive
    integration: api
    invocation: "GET https://otx.alienvault.com/api/v1/indicators/domain/{domain}/passive_dns"
    input: domain
    output: subdomain
    output_format: json
    requires_key: false
    default_on: true
    chains_to: [2, 12]

  github_subdomains:
    category: 2
    phase: p2_expansion
    type: passive
    integration: cli
    binary: github-subdomains
    install: {method: go, ref: "github.com/gwen001/github-subdomains@latest"}
    # {key} now resolves to the GITHUB_TOKEN (_aux_tokens); the CLI adapter's
    # available() skips this tool cleanly when the token is absent. -o dropped:
    # github-subdomains prints discovered subdomains to stdout.
    invocation: "github-subdomains -d {domain} -t {key}"
    input: domain
    output: subdomain
    output_format: text
    parse:
      format: text
      emit:
        - {entity: asset, value: "{_value}", type: subdomain, scope_filter: subdomain}
    requires_key: GITHUB_TOKEN
    default_on: false
    chains_to: [2, 9]

  amass:
    category: 2
    phase: p2_expansion
    type: passive          # passive mode; active brute is a toggle
    integration: cli
    binary: amass
    install: {method: go, ref: "github.com/owasp-amass/amass/v4/...@master"}
    # -json {outfile} rendered to "" -> amass wrote JSON to a file named "" and
    # the adapter (which parses stdout) saw nothing. Drop it: amass prints the
    # discovered FQDNs to stdout as plain text, one per line. {domain} fills fine.
    invocation: "amass enum -passive -d {domain}"
    input: domain
    output: subdomain
    output_format: text
    parse:
      format: text
      emit:
        - {entity: asset, value: "{_value}", type: subdomain, scope_filter: subdomain}
    requires_key: false
    default_on: false
    chains_to: [2, 3]
    notes: "Comprehensive but heavy. Run as one source, not the platform."

  alterx:
    category: 2
    phase: p2_expansion
    type: passive
    integration: cli
    binary: alterx
    install: {method: go, ref: "github.com/projectdiscovery/alterx/cmd/alterx@latest"}
    invocation: "alterx -l {infile} -o {outfile}"
    input: subdomain
    output: subdomain     # permutation candidates (must be resolved)
    output_format: text
    requires_key: false
    default_on: false
    chains_to: [2]
    # DEFERRED (recursion amplification): alterx emits permutation CANDIDATES, not
    # confirmed hosts. Emitting them as `subdomain` assets would re-feed the full
    # ~30-tool subdomain chain on thousands of non-existent hosts. Correct fix is a
    # new `subdomain_candidate` output type that ONLY feeds resolvers (puredns/dnsx)
    # for verification before promotion. Marked non_executable until that exists.
    non_executable: true
    non_executable_reason: "permutation candidates need a subdomain_candidate type -> resolver gate (else recursion amplifies); see review doc"
    notes: "Modern permutation engine; output MUST go through puredns/dnsx."

  dnsx:
    category: 2
    phase: p4_verify
    type: passive
    integration: cli
    binary: dnsx
    install: {method: go, ref: "github.com/projectdiscovery/dnsx/cmd/dnsx@latest"}
    # No -l/{infile}: GenericCliAdapter only substitutes {value}/{domain}/{ip}/{host},
    # so {infile} rendered to "" and -l consumed -json as a bogus filename, giving
    # 0 results every run. dnsx reads hosts from stdin when -l is omitted.
    invocation: "dnsx -json -a -aaaa -cname -resp -silent"
    stdin: true
    input: subdomain
    output: ip
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - {entity: asset, value_each: a, type: ip, scope_filter: ip}
        - {entity: asset, value_each: aaaa, type: ip, scope_filter: ip}
    requires_key: false
    default_on: true
    chains_to: [21, 24]
    notes: "Resolve/validate. A/AAAA -> resolves_to, CNAME -> cname_to (takeover input)."

  puredns:
    category: 2
    phase: p4_verify
    type: passive
    integration: cli
    binary: puredns
    install: {method: go, ref: "github.com/d3mondev/puredns/v2@latest"}
    # {resolvers} now resolves to config/resolvers.txt (_aux_tokens); reads the
    # candidate list from /dev/stdin (one piped per item) and prints resolved,
    # wildcard-filtered names to stdout (--write dropped). -q = results only.
    invocation: "puredns resolve /dev/stdin -r {resolvers} -q"
    stdin: true
    input: subdomain
    output: subdomain     # resolving + wildcard-filtered
    output_format: text
    parse:
      format: text
      emit:
        - {entity: asset, value: "{_value}", type: subdomain, scope_filter: subdomain}
    requires_key: false
    default_on: false
    chains_to: [4, 5]
    notes: "Orchestrates massdns; killer feature is wildcard filtering. Needs resolvers."

  massdns:
    category: 2
    phase: p4_verify
    type: passive
    integration: cli
    binary: massdns
    install: {method: git, ref: "https://github.com/blechschmidt/massdns"}
    # {resolvers} resolves now; read names from /dev/stdin, write -o S (simple:
    # "name. A 1.2.3.4") to /dev/stdout. line_regex pulls the resolved A record.
    invocation: "massdns -r {resolvers} -t A -o S -w /dev/stdout /dev/stdin"
    stdin: true
    input: subdomain
    output: ip
    output_format: text
    parse:
      format: text
      line_regex: '^\S+\s+A\s+(?P<_value>\d+\.\d+\.\d+\.\d+)'
      emit:
        - {entity: asset, value: "{_value}", type: ip, scope_filter: ip}
    requires_key: false
    default_on: false
    notes: "Internet-scale resolver; used under puredns/shuffledns."

  dnsvalidator:
    category: 2
    phase: p4_verify
    type: passive
    integration: cli
    binary: dnsvalidator
    install: {method: pip, ref: "dnsvalidator"}
    invocation: "dnsvalidator -tL https://public-dns.info/nameservers.txt -threads 100 -o {outfile}"
    input: none
    output: resolver_list
    output_format: text
    requires_key: false
    default_on: false
    # Resource GENERATOR, not a scan tool: builds config/resolvers.txt for
    # puredns/massdns (input:none, output:resolver_list -- not an entity type).
    # Already invoked by docker/install_tools.sh:install_resources at build time.
    non_executable: true
    non_executable_reason: "resource generator (builds resolvers.txt at install), not a scan-time entity producer"
    notes: "Produces clean resolver list for puredns/massdns (reduces false positives)."

  tlsx:
    category: 24
    phase: p4_verify
    type: active
    integration: cli
    binary: tlsx
    install: {method: go, ref: "github.com/projectdiscovery/tlsx/cmd/tlsx@latest"}
    # -l {infile} rendered to "" -> 0 results. tlsx reads host[:port] from stdin;
    # connects :443 by default, so it runs on plain `subdomain` keys (was
    # host_port, which NOTHING produces -> tlsx was also unreachable). -json -san
    # -cn emits the cert's SANs + CN, which become NEW in-scope subdomains.
    invocation: "tlsx -json -san -cn -silent"
    stdin: true
    input: subdomain
    output: subdomain    # SANs/CN from live certs
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - {entity: asset, value_each: subject_an, type: subdomain, scope_filter: subdomain}
        - {entity: asset, value: "{subject_cn}", type: subdomain, scope_filter: subdomain}
    requires_key: false
    default_on: false
    chains_to: [2, 24]
    notes: "Pulls SANs from live certs -> new subdomains. Also TLS fingerprint (JARM)."

  # ===========================================================================
  # CATEGORY 3 — WHOIS / ASN / BGP / Network Intelligence   [PASSIVE]
  # ===========================================================================

  asnmap:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: asnmap
    install: {method: go, ref: "github.com/projectdiscovery/asnmap/cmd/asnmap@latest"}
    invocation: "asnmap -d {domain} -json"
    input: domain
    output: cidr
    output_format: jsonl
    requires_key: false
    default_on: true
    chains_to: [21]
    notes: "domain/org/asn/ip -> CIDR ranges. Feeds port scanning targets."

  bgpview:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://api.bgpview.io/asn/{asn}/prefixes"
    input: asn
    output: cidr
    output_format: json
    requires_key: false
    default_on: true
    chains_to: [21]

  ripestat:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://stat.ripe.net/data/announced-prefixes/data.json?resource={asn}"
    input: asn
    output: cidr
    output_format: json
    parse:
      format: json
      list_path: data.prefixes
      emit:
        # AS13335-style ASN lookups return a CDN's ENTIRE global prefix list
        # (thousands of blocks) -- cidr_size drops supernets/IPv6 ranges too
        # big to be a dedicated allocation; see generic.py:_scope_ok.
        - {entity: asset, value: "{prefix}", type: cidr, scope_filter: cidr_size}
    requires_key: false
    default_on: true

  ipinfo:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://ipinfo.io/{ip}?token={key}"
    input: ip
    output: asn
    output_format: json
    requires_key: IPINFO_TOKEN
    default_on: false
    notes: "IP -> asn/org/geo enrichment. Free 50k/mo."

  metabigor:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: metabigor
    install: {method: go, ref: "github.com/j3ssie/metabigor@latest"}
    # The `echo {org} | ...` shell pipe never worked: the adapter uses
    # subprocess_exec (no shell), so the pipe + {outfile} were never honored.
    # metabigor reads the org from stdin natively and prints CIDRs to stdout.
    # cidr_size guards against an over-broad shared-ASN result (see ripestat).
    invocation: "metabigor net --org"
    stdin: true
    input: org
    output: cidr
    output_format: text
    parse:
      format: text
      emit:
        - {entity: asset, value: "{_value}", type: cidr, scope_filter: cidr_size}
    requires_key: false
    default_on: false
    notes: "ASN/IP/org discovery with NO API key. Great free pivot."

  mapcidr:
    category: 3
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: mapcidr
    install: {method: go, ref: "github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest"}
    # -cidr {cidr}/-o {outfile} both rendered to "" (unsupported template
    # tokens) -> 0 results. mapcidr reads the CIDR from stdin and writes
    # one IP per line to stdout when -o is omitted.
    invocation: "mapcidr -silent"
    stdin: true
    input: cidr
    output: ip
    output_format: text
    requires_key: false
    default_on: false
    chains_to: [21]

  # ===========================================================================
  # CATEGORY 4 — Search Engine Dorking & URL Recon   [PASSIVE]
  # ===========================================================================

  gau:
    category: 4
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: gau
    install: {method: go, ref: "github.com/lc/gau/v2/cmd/gau@latest"}
    invocation: "gau {domain} --threads 5 --providers wayback,otx,urlscan --timeout 15"
    timeout: 120
    input: domain
    output: url
    output_format: text
    requires_key: false
    default_on: true
    chains_to: [22, 25]
    notes: "Wayback+OTX+URLScan (commoncrawl dropped: slow/flaky, stalled scans ~5min for 0 results); --timeout 15 fails fast. Plain-text output to match the parser."

  waybackurls:
    category: 4
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: waybackurls
    install: {method: go, ref: "github.com/tomnomnom/waybackurls@latest"}
    invocation: "waybackurls {domain}"
    input: domain
    output: url
    output_format: text
    requires_key: false
    default_on: false
    notes: "Subset of gau (wayback only)."

  # gf is really N tools, one per pattern (the ~/.gf/*.json DB). `variants`
  # expands it into gf-ssrf, gf-xss, ... (engine/registry.py:_expand_variants),
  # each reading the URL corpus from stdin and emitting a vuln-CANDIDATE finding
  # for matching URLs (the detector = tool name carries which pattern matched).
  gf:
    category: 4
    phase: p5_deep
    type: passive
    integration: cli
    binary: gf
    invocation: "gf {pattern}"
    stdin: true
    input: url
    output: finding
    output_format: text
    parse:
      format: text
      emit:
        - {entity: finding, title: "URL matches gf pattern: {_value}", kind: vuln_candidate, severity: info, asset_value: "{_value}"}
    variants:
      field: pattern
      items: [ssrf, xss, sqli, ssti, lfi, rce, redirect, idor, interestingparams, debug_logic]
    requires_key: false
    default_on: false
    chains_to: [25]
    notes: "Pattern-match URLs (ssrf/xss/redirect/idor) to triage attack surface."

  # unfurl extracts URL components; each mode produces a DIFFERENT entity type,
  # so the variants carry per-mode output + parse. -u = unique. domains can
  # surface NEW in-scope subdomains from the URL corpus; keys yields param names.
  unfurl:
    category: 4
    phase: p5_deep
    type: passive
    integration: cli
    binary: unfurl
    invocation: "unfurl -u {mode}"
    stdin: true
    input: url
    output: subdomain        # primary mode; each variant overrides per-mode
    output_format: text
    variants:
      field: mode
      items:
        - value: domains
          output: subdomain
          parse:
            format: text
            emit:
              - {entity: asset, value: "{_value}", type: subdomain, scope_filter: subdomain}
        - value: keys
          output: param
          parse:
            format: text
            emit:
              - {entity: asset, value: "{_value}", type: param}
    requires_key: false
    default_on: false

  paramspider:
    category: 25
    phase: p5_deep
    type: passive
    integration: cli
    binary: paramspider
    install: {method: pip, ref: "git+https://github.com/devanshbatham/ParamSpider"}
    invocation: "paramspider -d {domain}"
    input: domain
    output: url
    output_format: text
    requires_key: false
    default_on: false
    chains_to: [25]

  # ===========================================================================
  # CATEGORY 5 — Web Tech Fingerprinting + HTTP Probing   [ACTIVE]
  # ===========================================================================

  httpx:
    category: 5
    phase: p4_verify
    type: active
    integration: cli
    binary: httpx
    install: {method: go, ref: "github.com/projectdiscovery/httpx/cmd/httpx@latest"}
    # -l {infile} rendered to "" (unsupported token) -> httpx got no targets and
    # produced 0. httpx reads hosts from stdin when -l is omitted; -json writes
    # JSONL to stdout (which the adapter captures). One host piped per work item.
    invocation: "httpx -json -sc -title -tech-detect -tls-grab -cdn -ip -cname -web-server -silent"
    stdin: true
    input: subdomain
    output: url
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - {entity: endpoint, url: "{url}"}
        - {entity: asset, value_each: a, type: ip, scope_filter: ip}
    requires_key: false
    default_on: true
    chains_to: [13, 20, 22, 27]
    notes: "The active hub. Sets is_live, tech[], cdn/waf tags, TLS, content hash."

  whatweb:
    category: 5
    phase: p4_verify
    type: active
    integration: cli
    binary: whatweb
    install: {method: apt, ref: "whatweb"}
    invocation: "whatweb --log-json={outfile} {url}"
    input: url
    output: tech
    output_format: json
    requires_key: false
    default_on: false

  wafw00f:
    category: 5
    phase: p4_verify
    type: active
    integration: cli
    binary: wafw00f
    install: {method: pip, ref: "wafw00f"}
    # -o /dev/stdout -f json writes the JSON report ([{url,detected,firewall}])
    # to stdout; wafw00f's progress goes to stderr (DEVNULL'd by the adapter).
    invocation: "wafw00f {url} -o /dev/stdout -f json"
    input: url
    output: finding
    output_format: json
    parse:
      format: json
      emit:
        - entity: finding
          when: {detected: "True"}
          title: "WAF detected ({firewall}) on {url}"
          kind: waf
          severity: info
          asset_value: "{url}"
    requires_key: false
    default_on: false
    notes: "Detect WAF -> informs rate strategy."

  cdncheck:
    category: 5
    phase: p4_verify
    type: passive
    integration: cli
    binary: cdncheck
    install: {method: go, ref: "github.com/projectdiscovery/cdncheck/cmd/cdncheck@latest"}
    invocation: "cdncheck -i {infile} -resp"
    input: ip
    output: tag
    output_format: text
    requires_key: false
    default_on: false
    # cdncheck's job is to TAG CDN IPs so the engine skips port-scanning CDN edge
    # ranges -- that's a noise-filter concern (engine/noise.py), not an entity the
    # graph recurses on (output:tag is not a canonical type). Wiring it as a
    # finding-producer would emit one low-value finding per CDN IP (pure noise).
    # Marked non_executable until integrated into the noise filter directly.
    non_executable: true
    non_executable_reason: "CDN tagging feeds the noise filter (engine/noise.py), not the entity graph"
    notes: "Flag CDN hosts so we don't port-scan CDN edge ranges."

  # ===========================================================================
  # CATEGORY 6 — Historical & Archive Recon   [PASSIVE]
  # ===========================================================================

  waymore:
    category: 6
    phase: p3_enrichment
    type: passive
    integration: cli
    binary: waymore
    install: {method: pip, ref: "waymore"}
    # -oU /dev/stdout streams the URLs; line_regex keeps only URL lines (waymore's
    # progress/banner also reaches stdout). Broader source set than gau/wayback.
    invocation: "waymore -i {domain} -mode U -oU /dev/stdout -p 4"
    input: domain
    output: url
    output_format: text
    parse:
      format: text
      line_regex: '^(?P<_value>https?://\S+)$'
      emit:
        - {entity: endpoint, url: "{_value}"}
    requires_key: false
    default_on: false
    chains_to: [22, 25]
    notes: "Best archive aggregator (wayback+cc+otx+urlscan + downloads responses)."

  wayback_cdx:
    category: 6
    phase: p3_enrichment
    type: passive
    integration: api
    # output=json wraps every row (incl. a ["original"] header) in its own
    # array, which the JSON parser can't cleanly map to a single url field.
    # Drop output=json: the CDX API then returns one plain URL per line.
    invocation: "GET http://web.archive.org/cdx/search/cdx?url=*.{domain}/*&fl=original&collapse=urlkey"
    input: domain
    output: url
    output_format: text
    parse:
      format: text
      emit:
        - {entity: asset, value: "{_value}", type: url}
    requires_key: false
    default_on: true
    chains_to: [22]
    notes: "Also downloads .js to artifacts/js/ for Cat 22."

  # ===========================================================================
  # CATEGORY 9 — GitHub / GitLab / Source-Code Recon   [PASSIVE -> ACTIVE]
  # ===========================================================================

  gitleaks:
    category: 9
    phase: p5_deep
    type: passive
    integration: cli
    binary: gitleaks
    install: {method: go, ref: "github.com/gitleaks/gitleaks/v8@latest"}
    invocation: "gitleaks detect --source {repo} --report-format json --report-path {outfile} --no-banner"
    input: repo
    output: finding
    output_format: json
    requires_key: false
    default_on: false
    notes: "Store hash+mask+location ONLY, never raw secret."

  trufflehog:
    category: 9
    phase: p5_deep
    type: passive          # verification (--only-verified) is active -> toggle
    integration: cli
    binary: trufflehog
    install: {method: go, ref: "github.com/trufflesecurity/trufflehog/v3@latest"}
    invocation: "trufflehog filesystem {repo} --json"
    input: repo
    output: finding
    output_format: jsonl
    requires_key: false
    default_on: false

  # github code-search is one tool per dork: `variants` expands it into
  # github_search-api_key, github_search-filename:.env, ... each searching the
  # org's code for a secret pattern and emitting the matching file's repo (which
  # gitleaks/trufflehog then deep-scan). Code search REQUIRES auth -> no
  # key_optional, so available() skips it without a GITHUB_TOKEN.
  github_search:
    category: 9
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://api.github.com/search/code?q={dork}+org:{org}"
    headers:
      Authorization: "Bearer {key}"
    input: org
    output: repo
    output_format: json
    parse:
      format: json
      list_path: items
      emit:
        - {entity: asset, value: "{repository.html_url}", type: repo}
    variants:
      field: dork
      items: [api_key, secret_key, aws_access_key_id, "filename:.env", "filename:.npmrc", "filename:id_rsa"]
    requires_key: GITHUB_TOKEN
    default_on: false
    notes: "30 req/min code search + strict secondary limits -> queue + token rotation."

  # Producer for the `repo` entity type: lists an org's public repos so gitleaks/
  # trufflehog have something to scan. key_optional -> works keyless (60 req/hr)
  # and uses the token (Authorization header) when present.
  github_org_repos:
    category: 9
    phase: p2_expansion
    type: passive
    integration: api
    invocation: "GET https://api.github.com/orgs/{org}/repos?per_page=100&type=public"
    headers:
      Authorization: "Bearer {key}"
    input: org
    output: repo
    output_format: json
    parse:
      format: json
      emit:
        - {entity: asset, value: "{clone_url}", type: repo}
    requires_key: GITHUB_TOKEN
    key_optional: true
    default_on: false
    notes: "List a GitHub org's public repos -> repo assets for secret scanners."

  # ===========================================================================
  # CATEGORY 10 — Cloud & Storage Recon   [PASSIVE -> ACTIVE]
  # ===========================================================================

  grayhatwarfare:
    category: 10
    phase: p3_enrichment
    type: passive
    integration: api
    invocation: "GET https://buckets.grayhatwarfare.com/api/v2/buckets?keywords={keyword}"
    input: keyword
    output: bucket
    output_format: json
    requires_key: GRAYHATWARFARE_API_KEY
    default_on: false

  cloud_enum:
    category: 10
    phase: p5_deep
    type: active
    integration: cli
    binary: cloud_enum
    install: {method: git, ref: "https://github.com/initstring/cloud_enum"}
    # -l {outfile} is just a logfile; cloud_enum prints hits to stdout as
    # "[+] OPEN ... BUCKET: https://...". line_regex lifts the URL of each
    # publicly-readable bucket into an exposed-storage finding.
    invocation: "cloud_enum -k {keyword} -t 20"
    input: keyword
    output: finding
    output_format: text
    parse:
      format: text
      line_regex: 'OPEN.*?:\s*(?P<_value>https?://\S+)'
      emit:
        - {entity: finding, title: "Public cloud bucket: {_value}", kind: exposed_bucket, severity: medium, asset_value: "{_value}"}
    requires_key: false
    default_on: false

  s3scanner:
    category: 10
    phase: p5_deep
    type: active
    integration: cli
    binary: s3scanner
    install: {method: go, ref: "github.com/sa7mon/s3scanner@latest"}
    # -bucket-file {infile} -> ""; use single-bucket mode on the consumed value.
    # -json emits one JSONL object per bucket; flag the ones that exist/are open.
    invocation: "s3scanner -bucket {bucket} -json"
    input: bucket
    output: finding
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - entity: finding
          when: {exists: "3"}        # s3scanner: 3 = exists
          title: "Open/again-readable S3 bucket: {bucket}"
          kind: exposed_bucket
          severity: medium
          asset_value: "{bucket}"
    requires_key: false
    default_on: false

  # ===========================================================================
  # CATEGORY 12 — Malware / IOC / Threat Intel & CVE Correlation   [PASSIVE]
  # ===========================================================================

  nvd:
    category: 12
    phase: p6_vuln
    type: passive
    integration: api
    invocation: "GET https://services.nvd.nist.gov/rest/json/cves/2.0?cpeName={cpe}"
    input: cpe
    output: finding
    output_format: json
    requires_key: NVD_API_KEY
    default_on: false
    notes: "Authoritative CVE metadata. Without key = harsh throttle. GET a key."

  epss:
    category: 12
    phase: p6_vuln
    type: passive
    integration: api
    invocation: "GET https://api.first.org/data/v1/epss?cve={cve}"
    input: cve
    output: finding
    output_format: json
    parse:
      format: json
      list_path: data
      emit:
        - entity: finding
          title: "EPSS {cve}: score {epss} (percentile {percentile})"
          kind: epss_score
          severity: info
          cve_id: "{cve}"
    requires_key: false
    default_on: true
    notes: "Exploit probability -> drives priority_rank."

  vulners:
    category: 12
    phase: p6_vuln
    type: passive
    integration: api
    invocation: "POST https://vulners.com/api/v3/search/lucene/"
    input: cpe
    output: finding
    output_format: json
    requires_key: VULNERS_API_KEY
    default_on: false

  # ===========================================================================
  # CATEGORY 13 — Visual Recon & Screenshotting   [ACTIVE]
  # ===========================================================================

  gowitness:
    category: 13
    phase: p4_verify
    type: active
    integration: cli
    binary: gowitness
    install: {method: go, ref: "github.com/sensepost/gowitness@latest"}
    invocation: "gowitness scan file -f {infile} --write-db --screenshot-path {outdir}"
    input: url
    output: screenshot
    output_format: screenshot
    requires_key: false
    default_on: false
    notes: "Headless chrome screenshots -> artifacts/, link to endpoint.evidence_ref."

  # ===========================================================================
  # CATEGORY 20 — Content & Directory Discovery   [ACTIVE]   (NEW)
  # ===========================================================================

  ffuf:
    category: 20
    phase: p5_deep
    type: active
    integration: cli
    binary: ffuf
    install: {method: go, ref: "github.com/ffuf/ffuf/v2@latest"}
    # {wordlist} resolves to a SecLists path now; -s silences progress so -o
    # /dev/stdout carries ONLY the result JSON ({"results":[{url,status},...]}).
    invocation: "ffuf -u {url}/FUZZ -w {wordlist} -mc 200,204,301,302,307,401,403 -of json -o /dev/stdout -s"
    input: url
    output: url
    output_format: json
    parse:
      format: json
      list_path: results
      emit:
        - {entity: endpoint, url: "{url}"}
    requires_key: false
    default_on: false
    chains_to: [25, 27]
    notes: "Wordlists from Cat 28 (SecLists) + harvested paths (Cat 11)."

  feroxbuster:
    category: 20
    phase: p5_deep
    type: active
    integration: cli
    binary: feroxbuster
    install: {method: binary, ref: "https://github.com/epi052/feroxbuster"}
    # {wordlist} resolves now; --json writes JSONL events to stdout when -o is
    # omitted. Each line has a "type"; only type=response rows are real hits.
    invocation: "feroxbuster -u {url} -w {wordlist} --json --silent"
    input: url
    output: url
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - {entity: endpoint, url: "{url}", when: {type: response}}
    requires_key: false
    default_on: false

  # ===========================================================================
  # CATEGORY 21 — Port Scanning & Service Detection   [ACTIVE]   (NEW)
  # ===========================================================================

  naabu:
    category: 21
    phase: p4_verify
    type: active
    integration: cli
    binary: naabu
    install: {method: go, ref: "github.com/projectdiscovery/naabu/v2/cmd/naabu@latest"}
    invocation: "naabu -list {infile} -top-ports {ports} -json -silent"
    input: ip
    output: host_port
    output_format: jsonl
    requires_key: false
    default_on: true
    chains_to: [5, 12, 24]
    notes: "Fast port discovery; feeds nmap for deep scan."

  nmap:
    category: 21
    phase: p5_deep
    type: active
    integration: cli
    binary: nmap
    install: {method: apt, ref: "nmap"}
    invocation: "nmap -sV -sC -p {ports} -oX {outfile} {host}"
    input: host_port
    output: service
    output_format: xml
    requires_key: false
    default_on: false
    chains_to: [12]
    notes: "Deep service/version detection ONLY on naabu-found ports."

  masscan:
    category: 21
    phase: p5_deep
    type: active
    integration: cli
    binary: masscan
    install: {method: apt, ref: "masscan"}
    # {ports}/{rate} resolve from the active profile now; drop -oJ {outfile} and
    # parse masscan's default stdout ("Discovered open port 443/tcp on 1.2.3.4").
    # Oversized CIDRs are already dropped upstream by _expandable_cidr.
    invocation: "masscan {cidr} -p{ports} --rate {rate}"
    input: cidr
    output: host_port
    output_format: text
    parse:
      format: text
      line_regex: 'Discovered open port (?P<port>\d+)/\w+ on (?P<host>\d+\.\d+\.\d+\.\d+)'
      emit:
        - {entity: service, host: "{host}", port: "{port}"}
    requires_key: false
    default_on: false
    notes: "For huge ranges. Respect rate profile (very noisy)."

  # ===========================================================================
  # CATEGORY 22 — JavaScript Analysis & Secret Extraction   [PASSIVE/ACTIVE]  (NEW)
  # ===========================================================================

  katana:
    category: 22
    phase: p5_deep
    type: active
    integration: cli
    binary: katana
    install: {method: go, ref: "github.com/projectdiscovery/katana/cmd/katana@latest"}
    # -list {infile} rendered to "" -> katana crawled nothing. katana reads URLs
    # from stdin when -list is omitted; -silent prints one discovered URL per line
    # (more robust to parse than its nested -json shape). One URL piped per item.
    # -ct bounds the crawl so katana TERMINATES and flushes results within the
    # adapter timeout — without it a deep (-d 3) JS crawl on a big site runs past
    # the 150s kill and the adapter (which reads stdout only after exit) gets 0.
    invocation: "katana -jc -js-crawl -d 3 -ct 90 -silent"
    stdin: true
    timeout: 150
    input: url
    output: url
    output_format: text
    parse:
      format: text
      emit:
        - {entity: endpoint, url: "{_value}"}
    requires_key: false
    default_on: false
    chains_to: [22, 25]
    notes: "JS-aware crawler; discovers js_file + endpoints. New hosts loop to httpx."

  # NOTE linkfinder/secretfinder were integration:python with `python script.py`
  # and no handwritten adapter -> no executor (invalid contract). Reclassified to
  # cli with the pip console-script name; they SKIP cleanly if the binary is
  # absent. Both are superseded by jsluice (below) + the handwritten pycrawl/
  # jsanalyze (which already pull JS endpoints + secrets) -- kept as available
  # alternatives, not default_on.
  linkfinder:
    category: 22
    phase: p5_deep
    type: passive
    integration: cli
    binary: linkfinder
    install: {method: pip, ref: "linkfinder"}
    invocation: "linkfinder -i {js_file} -o cli"
    input: js_file
    output: url
    output_format: text
    parse:
      format: text
      emit:
        - {entity: endpoint, url: "{_value}"}
    requires_key: false
    default_on: false

  secretfinder:
    category: 22
    phase: p5_deep
    type: passive
    integration: cli
    binary: secretfinder
    install: {method: pip, ref: "secretfinder"}
    invocation: "secretfinder -i {js_file} -o cli"
    input: js_file
    output: finding
    output_format: text
    parse:
      format: text
      emit:
        - {entity: finding, title: "Possible secret in JS: {_value}", kind: secret, severity: medium}
    requires_key: false
    default_on: false
    notes: "API keys in JS. Store redacted only. Superseded by jsluice/pycrawl."

  jsluice:
    category: 22
    phase: p5_deep
    type: passive
    integration: cli
    binary: jsluice
    install: {method: go, ref: "github.com/BishopFox/jsluice/cmd/jsluice@latest"}
    invocation: "jsluice urls {js_file}"
    input: js_file
    output: url
    output_format: jsonl
    requires_key: false
    default_on: false
    notes: "Modern JS URL+secret extraction (better than LinkFinder)."

  # ===========================================================================
  # CATEGORY 23 — API & GraphQL Recon   [ACTIVE]   (NEW)
  # ===========================================================================

  # Was integration:python with `python main.py` (no executor). Reclassified to
  # cli with the console-script name; skips cleanly if absent. GraphQL engine
  # fingerprinting is unique (not covered elsewhere), so kept as an alternative.
  graphw00f:
    category: 23
    phase: p5_deep
    type: active
    integration: cli
    binary: graphw00f
    install: {method: pip, ref: "graphw00f"}
    invocation: "graphw00f -d -f -t {url}"
    input: url
    output: finding
    output_format: text
    parse:
      format: text
      emit:
        - {entity: finding, title: "GraphQL fingerprint: {_value}", kind: graphql, severity: info}
    requires_key: false
    default_on: false

  kiterunner:
    category: 23
    phase: p5_deep
    type: active
    integration: cli
    binary: kr
    install: {method: binary, ref: "https://github.com/assetnote/kiterunner"}
    # Reads targets from /dev/stdin; {kite_wordlist} resolves to the installed
    # routes .kite (config `resources.kite_wordlist`, default /opt/kite/...).
    # -o json streams matched routes to stdout (one JSON object per line).
    invocation: "kr scan /dev/stdin -w {kite_wordlist} -o json --quiet"
    stdin: true
    input: url
    output: url
    output_format: jsonl
    parse:
      format: jsonl
      emit:
        - {entity: endpoint, url: "{url}"}
    requires_key: false
    default_on: false

  # ===========================================================================
  # CATEGORY 24 — TLS/SSL & Certificate Analysis   [ACTIVE]   (NEW)
  # (tlsx listed under Cat 2 region above; sslyze/cero here)
  # ===========================================================================

  sslyze:
    category: 24
    phase: p6_vuln
    type: active
    integration: cli
    binary: sslyze
    install: {method: pip, ref: "sslyze"}
    invocation: "sslyze --json_out {outfile} {host}"
    input: host_port
    output: finding
    output_format: json
    requires_key: false
    default_on: false
    notes: "Weak cipher/expired/self-signed -> tls findings."

  cero:
    category: 24
    phase: p4_verify
    type: active
    integration: cli
    binary: cero
    install: {method: go, ref: "github.com/glebarez/cero@latest"}
    # No {infile}: GenericCliAdapter only substitutes {value}/{domain}/{ip}/{host},
    # so {infile} rendered to "" and cero ran with no target + no stdin, exiting
    # near-instantly with 0 results every run. cero accepts the target IP as a
    # positional argument directly.
    invocation: "cero {value}"
    input: ip
    output: subdomain
    output_format: text
    requires_key: false
    default_on: false
    notes: "Scrape domains from TLS certs of IP ranges -> new subdomains."

  # ===========================================================================
  # CATEGORY 27 — Active Vulnerability Detection   [ACTIVE]
  # ===========================================================================

  nuclei:
    category: 27
    phase: p6_vuln
    type: active
    integration: cli
    binary: nuclei
    install: {method: go, ref: "github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"}
    invocation: "nuclei -l {infile} -jsonl -silent -severity {severities} -rl {rate}"
    input: url
    output: finding
    output_format: jsonl
    requires_key: false
    default_on: true
    chains_to: [12]
    notes: "Templated DETECTION only (no exploitation). Tags scope what runs."

  subjack:
    category: 24
    phase: p6_vuln
    type: active
    integration: cli
    binary: subjack
    install: {method: go, ref: "github.com/haccer/subjack@latest"}
    # -w reads the candidate list from /dev/stdin (one piped per item); -c points
    # at the now-installed fingerprints DB ({fingerprints}); -o dropped so results
    # go to stdout. subjack prints only takeover-able hosts, each becomes a finding.
    invocation: "subjack -w /dev/stdin -c {fingerprints} -ssl"
    stdin: true
    input: subdomain
    output: finding
    output_format: text
    parse:
      format: text
      emit:
        - {entity: finding, title: "Possible subdomain takeover: {_value}", kind: takeover, severity: high, asset_value: "{_value}"}
    requires_key: false
    default_on: false
    notes: "Subdomain takeover detection (dangling CNAME)."

  # ===========================================================================
  # UTILITY / GLUE   (cross-cutting plumbing)
  # ===========================================================================

  anew:
    category: 0
    phase: p1_seed
    type: passive
    integration: cli
    binary: anew
    install: {method: go, ref: "github.com/tomnomnom/anew@latest"}
    invocation: "cat {infile} | anew {outfile}"
    input: any
    output: any
    output_format: text
    requires_key: false
    default_on: false
    # anew is a dedupe PIPE UTILITY (stdin -> new lines), not a recon source: it
    # discovers nothing and emits no entity type. The engine dedupes on enqueue
    # already, so it has no role in the entity graph -> not scan-routable.
    non_executable: true
    non_executable_reason: "pipe utility (dedupe), emits no entities; engine dedupes on enqueue"
    notes: "Append-only dedupe; glue for incremental/streaming pipelines."

  interactsh:
    category: 14
    phase: p6_vuln
    type: active
    integration: cli
    binary: interactsh-client
    install: {method: go, ref: "github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest"}
    invocation: "interactsh-client -json"
    input: none
    output: finding
    output_format: jsonl
    requires_key: false
    default_on: false
    notes: "OOB/OAST infra for blind interaction detection (used by nuclei)."

  notify:
    category: 14
    phase: p1_seed
    type: passive
    integration: cli
    binary: notify
    install: {method: go, ref: "github.com/projectdiscovery/notify/cmd/notify@latest"}
    invocation: "cat {infile} | notify -silent"
    input: any
    output: none
    output_format: text
    requires_key: false
    default_on: false
    # notify is an OUTPUT SINK (pushes to slack/discord/telegram); output:none ->
    # it produces no recon entities. Belongs in a post-scan alert hook, not the
    # scan tool-routing graph.
    non_executable: true
    non_executable_reason: "output sink (alerting), produces no entities; use as a post-scan hook"
    notes: "Alerting sink (slack/discord/telegram) for new assets/findings."
