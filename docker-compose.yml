# Optional backing services for production-grade deployments.
# Recontool runs without these (SQLite + in-process rate limiter by default).
# Bring them up when you want PostgreSQL + Redis:
#   docker compose up -d
# then set in .env:
#   RECON_DB_URL=postgresql+psycopg://recon:recon@localhost:5432/recontool
#   RECON_REDIS_URL=redis://localhost:6379/0

services:
  # The Recontool platform + all recon tools in one image.
  #   docker compose build recontool
  #   docker compose run --rm recontool scan www.xyz.com
  recontool:
    build: .
    image: recontool:latest
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./artifacts:/app/artifacts
    environment:
      # Point at postgres if you bring it up (else SQLite is used).
      # RECON_DB_URL: postgresql+psycopg://recon:recon@postgres:5432/recontool
      RECON_REDIS_URL: ""
    profiles: ["app"]   # `docker compose --profile app run recontool ...`

  # ── Horizontal worker fleet (the AWS-distribution unit) ──────────────────────
  # The atomic-claim queue lets N identical containers drain ONE scan in parallel,
  # each claiming work safely from the shared Postgres. This `worker` service IS
  # the unit you replicate across AWS (Fargate/ECS tasks or EC2) — point every
  # task at one RDS instance via RECON_DB_URL. Local usage:
  #   1) seed a scan (writes the queue + its scan id):
  #        docker compose --profile app run --rm recontool engine xyz.com --authorize-active
  #   2) fan out N workers to drain it:
  #        SCAN_ID=<id> docker compose --profile fleet up --scale worker=8 worker
  worker:
    build: .
    image: recontool:latest
    command: ["worker", "${SCAN_ID:?set SCAN_ID to the scan id to drain}", "--workers", "8"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECON_DB_URL: postgresql+psycopg://recon:recon@postgres:5432/recontool
    volumes:
      - ./config:/app/config
      - ./artifacts:/app/artifacts
    profiles: ["fleet"]

  # ── Read API + live SSE + scan control (auth-gated) ──────────────────────────
  # docker compose --profile api up api   (set RECON_API_TOKEN first)
  api:
    build: .
    image: recontool:latest
    command: ["serve", "--host", "0.0.0.0"]
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECON_DB_URL: postgresql+psycopg://recon:recon@postgres:5432/recontool
      RECON_API_TOKEN: "${RECON_API_TOKEN:?set RECON_API_TOKEN to enable the API}"
      RECON_API_HOST: 0.0.0.0
    volumes:
      - ./artifacts:/app/artifacts
    profiles: ["api"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recontool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # Explicitly target the recontool DB. Without -d, pg_isready connects to a
      # database named after the user ("recon"), which spams the server log with
      # 'FATAL: database "recon" does not exist' on every interval until that DB
      # exists. init-db.sh creates "recon" too, but -d makes the check robust
      # even on a pre-existing volume where init scripts no longer run.
      test: ["CMD-SHELL", "pg_isready -U recon -d recontool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  pgdata:
