[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recontool"
version = "0.1.0"
description = "Modular, AI-supervised reconnaissance & attack-surface mapping platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Recontool" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
ai = ["openai>=1.30"]
full = ["psycopg[binary]>=3.1", "redis>=5.0", "openai>=1.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "respx>=0.21"]

[project.scripts]
recontool = "recontool.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["recontool*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Compact multi-statement lines are intentional in these state-machine tests.
"tests/atomic/test_circuit.py" = ["E702"]
