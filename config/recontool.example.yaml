# ─────────────────────────────────────────────────────────────────────────────
# Recontool main configuration.
#
#   1. Copy this file:        cp config/recontool.example.yaml config/recontool.yaml
#   2. Fill in API keys you have (ALL optional — passive recon works with none).
#   3. Run:                    recontool scan www.xyz.com
#
# Precedence (highest wins):  ENV VAR  >  config/recontool.yaml  >  built-in defaults
# So you can keep secrets in env vars in CI and use this file locally.
# `config/recontool.yaml` is gitignored; this example file is safe to commit.
# ─────────────────────────────────────────────────────────────────────────────

general:
  # Run mode: demo | test | live
  #   demo : full pipeline against the built-in MOCK environment; NO real egress.
  #   test : recorded fixtures / mock; real egress BLOCKED (used by CI/E2E).
  #   live : real authorized targets; egress permitted (still scope+auth gated).
  mode: live
  # Default rate profile: passive_only | stealth | normal | aggressive
  profile: normal
  # Global cap on parallel tasks across the whole pipeline.
  max_concurrency: 20
  # Storage. SQLite by default (zero-setup). Switch to Postgres for scale.
  db_url: sqlite:///recontool.db
  # db_url: postgresql+psycopg://recon:recon@localhost:5432/recontool
  # Where JS files, response bodies, screenshots, raw tool output are written.
  artifact_dir: ./artifacts
  # Optional Redis for distributed rate-limit buckets (else in-process).
  redis_url: ""

# ── Scope allowlist (config-driven; augments the seed-derived scope) ──────────
# Authorized targets ONLY. Deny rules always override allow rules.
scope:
  allow_domains: []      # e.g. ["acme.com", "acme.net"]
  allow_cidrs: []        # e.g. ["203.0.113.0/24"]
  allow_asns: []         # e.g. ["AS65000"]
  deny_domains: []       # e.g. ["status.acme.com"]
  deny_cidrs: []

# ── Active-check allowlist (which active detectors may run) ───────────────────
active_checks:
  allow: []              # empty = all registered active checks permitted

# ── Recovery / checkpoint / resume ───────────────────────────────────────────
recovery:
  checkpoint_enabled: true     # write a checkpoint after each phase (enables --resume)
  max_deadletter_retries: 2    # how many times replay will re-attempt a parked unit
  resume_default: false

network:
  # IP ROTATION: list proxy URLs to rotate egress and dodge rate-limit bans.
  #   http://user:pass@host:port   |   socks5://host:port
  proxies: []
  # round_robin | random | sticky
  proxy_strategy: round_robin

ai:
  # Leave base_url/api_key empty to use zero-token heuristic decisions.
  # Works with OpenAI OR a local server (Ollama/vLLM/LM Studio).
  base_url: ""        # e.g. https://api.openai.com/v1  OR  http://localhost:11434/v1
  api_key: ""
  model_light: gpt-4o-mini   # cheap/fast: triage, planning, classification
  model_heavy: gpt-4o        # deep reasoning: final report only
  max_calls: 40              # hard per-scan budget (0 = unlimited)

# ── API keys for recon providers (all optional) ──────────────────────────────
# Category numbers refer to docs/pipeline/03-category-pipelines.md
api_keys:
  # Cat 1 — Internet-wide search
  shodan: ""
  censys_id: ""
  censys_secret: ""
  netlas: ""
  greynoise: ""
  leakix: ""
  fullhunt: ""
  urlscan: ""
  criminalip: ""
  binaryedge: ""
  zoomeye: ""
  fofa_email: ""
  fofa_key: ""

  # Cat 2 — Passive DNS / subdomains
  securitytrails: ""
  virustotal: ""
  chaos: ""
  certspotter: ""

  # Cat 3 — Network intel
  ipinfo: ""

  # Cat 9 — Source code
  github_token: ""
  gitlab_token: ""

  # Cat 10 — Cloud
  grayhatwarfare: ""

  # Cat 7 — Identity (PII — legally gated; enable deliberately)
  hunter: ""
  hibp: ""
  dehashed_user: ""
  dehashed_key: ""

  # Cat 12 — Vuln intel
  nvd: ""
  vulners: ""

# ── Per-category toggles ──────────────────────────────────────────────────────
# Enable/disable whole categories. Active categories also require --authorize-active.
categories:
  enabled:
    - 1    # internet-wide search
    - 2    # passive dns / subdomain
    - 3    # whois / asn / bgp
    - 6    # historical / archive
  # everything else off by default; turn on as you build them out

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  # Resolver list for puredns/massdns (generated by dnsvalidator).
  resolvers: ./config/resolvers.txt
  # Wordlists (Cat 20 content discovery). Point at SecLists after setup.
  wordlist_dir: ./wordlists
  default_wordlist: ./wordlists/common.txt
